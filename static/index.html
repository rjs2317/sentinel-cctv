<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SentinelHub CCTV</title>
<style>
  :root { --bg:#0b1020; --panel:#141a2e; --text:#e6e9f2; --muted:#8a93ad; --ok:#3ecf8e; --alert:#ff3b3b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Malgun Gothic",sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid #222a44; }
  h1 { font-size:20px; margin:0; letter-spacing:1px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; padding:20px 24px; }
  @media (max-width:860px){ main { grid-template-columns:1fr; } }
  .screen { background:#000; border:6px solid #222a44; border-radius:10px; overflow:hidden; transition:border-color .2s; }
  .screen img { display:block; width:100%; }
  body.alert .screen { border-color:var(--alert); animation:blink .6s infinite; }
  @keyframes blink { 50% { border-color:#5a0000; } }
  .panel { background:var(--panel); border-radius:10px; padding:16px; }
  .badge { display:inline-block; padding:6px 12px; border-radius:999px; font-weight:700; background:#1f3a2e; color:var(--ok); }
  body.alert .badge { background:#4a1010; color:var(--alert); }
  button { width:100%; margin:6px 0; padding:12px; border:0; border-radius:8px; background:#2b6cff; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button.on { background:#1f3a2e; color:var(--ok); }
  button.sub { background:#2a3150; }
  button.danger { background:#3a1d24; color:#ff8a8a; }
  .msg { min-height:20px; font-size:13px; color:var(--muted); margin:4px 0 10px; }
  .row { display:flex; justify-content:space-between; margin:8px 0; color:var(--muted); }
  .row b { color:var(--text); }
  h3 { margin:18px 0 0; font-size:15px; }
  ul { list-style:none; padding:0; margin:8px 0 0; max-height:220px; overflow:auto; font-size:13px; }
  li { padding:8px 0; border-bottom:1px solid #222a44; }
  li.d { color:var(--alert); }
  li.c { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>SENTINEL · CCTV</h1>
  <span class="badge" id="badge">정상</span>
</header>
<main>
  <div class="screen"><img src="/video" alt="CCTV 실시간 영상"></div>
  <div class="panel">
    <button id="soundBtn">🔔 경보음 켜기</button>
    <button class="sub" id="camBtn">📷 카메라 끄기</button>

    <h3>범인 등록</h3>
    <button class="sub" id="enrollBtn">📸 지금 얼굴을 범인으로 등록</button>
    <button class="danger" id="resetBtn">🗑 등록 초기화</button>
    <div class="msg" id="msg">정면·옆모습 등 3~5번 등록하면 더 정확해요.</div>

    <div class="row">등록된 특징값 <b id="enrolled">0</b></div>
    <div class="row">카메라 <b id="cam">확인 중</b></div>
    <div class="row">탐지된 사람 <b id="count">0</b></div>
    <div class="row">일반인 <b id="visitors">0</b></div>
    <div class="row">서버 연결 <b id="conn">확인 중</b></div>
    <div class="row">해상도 <b id="res">-</b></div>
    <div class="row">버전 <b id="ver" style="font-size:12px">-</b></div>

    <h3>경보 기록</h3>
    <ul id="log"></ul>
  </div>
</main>
<script>
  let audioCtx = null;
  let lastAlert = false;
  const $ = (id) => document.getElementById(id);

  $("soundBtn").addEventListener("click", () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    $("soundBtn").textContent = "🔊 경보음 켜짐";
    $("soundBtn").classList.add("on");
  });

  async function post(url) {
    const res = await fetch(url, { method: "POST" });
    return res.json();
  }

  let camEnabled = true;
  function renderCamBtn() {
    $("camBtn").textContent = camEnabled ? "📷 카메라 끄기" : "📷 카메라 켜기";
    $("camBtn").className = camEnabled ? "sub" : "";
  }
  $("camBtn").addEventListener("click", async () => {
    $("camBtn").disabled = true;
    try {
      const r = await post(camEnabled ? "/camera/off" : "/camera/on");
      if (r.ok) { camEnabled = r.camera_enabled; renderCamBtn(); }
    } finally { $("camBtn").disabled = false; }
  });

  $("enrollBtn").addEventListener("click", async () => {
    $("msg").textContent = "등록 중...";
    try {
      const r = await post("/enroll");
      $("msg").textContent = r.ok ? `등록 완료 (총 ${r.templates}개)` : r.message;
    } catch (e) { $("msg").textContent = "등록 실패: 서버 연결 확인"; }
  });

  $("resetBtn").addEventListener("click", async () => {
    if (!window.confirm("등록된 범인 얼굴 특징값을 모두 삭제할까요?")) return;
    const r = await post("/enroll/reset");
    $("msg").textContent = r.ok ? "등록이 초기화되었습니다." : "초기화 실패";
  });

  let high = false;
  function beep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = (high = !high) ? 960 : 720;
    gain.gain.value = 0.12;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }

  function addLog(text, cls) {
    const li = document.createElement("li");
    li.className = cls;
    li.textContent = new Date().toLocaleTimeString("ko-KR") + "  " + text;
    $("log").prepend(li);
  }

  async function poll() {
    try {
      const res = await fetch("/status", { cache: "no-store" });
      const s = await res.json();
      $("conn").textContent = "정상";
      if (s.camera_enabled !== camEnabled) { camEnabled = s.camera_enabled; renderCamBtn(); }
      $("cam").textContent = !s.camera_enabled ? "꺼짐" : (s.camera_ok ? "작동 중" : "켜는 중");
      $("count").textContent = s.person_count;
      $("visitors").textContent = s.visitor_count;
      $("res").textContent = s.resolution || "-";
      $("ver").textContent = s.version || "구버전";
      $("enrolled").textContent = s.enrolled;
      document.body.classList.toggle("alert", s.alert);
      $("badge").textContent = s.alert ? "⚠ 범인 감지" : (s.enrolled ? "정상" : "범인 미등록");

      if (s.alert) beep();
      if (s.alert && !lastAlert) addLog("범인 감지", "d");
      if (!s.alert && lastAlert) addLog("경보 해제", "c");
      lastAlert = s.alert;
    } catch (e) {
      $("conn").textContent = "끊김";
    }
  }
  setInterval(poll, 600);
  poll();
</script>
</body>
</html>
