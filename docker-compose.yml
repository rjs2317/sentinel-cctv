services:
  cctv:
    build: .
    container_name: sentinel-cctv
    ports:
      - "5001:5001"
    devices:
      - "/dev/video0:/dev/video0"   # Kali에 연결된 웹캠을 컨테이너에 전달
    environment:
      CAMERA_SOURCE: "0"
      CCTV_LOG: /app/logs/cctv_events.log
    volumes:
      - ./logs:/app/logs            # 감지 로그를 Kali 폴더에 남김 (나중에 Loki 수집용)
    restart: unless-stopped
