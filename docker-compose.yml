services:
  cctv:
    build: .
    container_name: sentinel-cctv
    ports:
      - "5001:5001"
    devices:
      - "/dev/video0:/dev/video0"   # Kali에 연결된 웹캠을 컨테이너에 전달
    environment:
      CAMERA_SOURCE: "0"
      CCTV_LOG: /app/logs/cctv_events.log
      FACE_DIR: /app/faces
      MATCH_THRESHOLD: "0.363"      # 높이면 더 엄격(오탐↓ 미탐↑), 낮추면 더 관대
      BLUR_OTHERS: "1"              # 일반인 얼굴 블러 (0이면 끔)
      CAM_WIDTH: "1920"             # 이 웹캠은 1920x1080 MJPG만 지원
      CAM_HEIGHT: "1080"
      CAM_FPS: "15"                 # 카메라 초당 장수 (끊기면 10)
      DISPLAY_WIDTH: "1280"         # 받은 즉시 이 폭으로 줄여서 처리 (끊기면 960)
      AI_MAX_FPS: "6"               # AI 판별 초당 횟수 상한 (끊기면 4)
      AI_THREADS: "2"               # AI가 쓰는 CPU 코어 수
      JPEG_QUALITY: "88"            # 화면 전송 화질 (60~95)
      STREAM_FPS: "15"              # 화면 초당 장수 (카메라와 같게)
      AI_WIDTH: "640"               # AI 판별용 축소 폭 (화면 화질과 무관)
      YOLO_IMGSZ: "320"             # 느리면 256, 정확도 필요하면 416
      CAMERA_ON_START: "1"          # 0이면 서버가 켜져도 카메라는 꺼진 채 시작
      LOKI_URL: "http://loki:3100"          # 같은 PC의 Loki 컨테이너 (아래 loki 서비스)
      CCTV_HOST: "192.168.0.108"            # 로그에 남길 CCTV 위치
    volumes:
      - ./logs:/app/logs            # 감지 로그 (Loki 수집용)
      - ./faces:/app/faces          # 범인 얼굴 특징값 (GitHub에 올리지 않음)
    depends_on:
      - loki
    restart: unless-stopped

  # CCTV 경보 로그 저장소 — 팀원 Grafana가 http://192.168.0.108:3101 으로 읽어감 (Kali에 이미 3100번을 쓰는 Loki가 있어서 3101번 사용)
  loki:
    image: grafana/loki:3.0.0
    container_name: sentinel-loki
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki                # 로그 보관 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped

volumes:
  loki-data:
